{{- if not .Values.opsgenie.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsgenie-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsgenie-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ required "opsgenie.apiKey is required when not using opsgenie.existingSecret" .Values.opsgenie.apiKey | quote }}
{{- end }}
